/* The house booking rules, settable by name. There is deliberately NO screen for these -
   the talk-to-text bar calls this directly. Validates and clamps, returns true when the
   value was accepted. The CALLER saves, so this stays usable from anywhere. */
function setBookingRule(field,v){
  var R=B().rules,n=Math.round(+v);
  if(!isFinite(n)||!field)return false;
  if(field==='startStep'){if([10,20,30,60].indexOf(n)<0)return false;R.startStep=n}   /* the engine buckets the grid to these four */
  else if(field==='advanceDays')R.advanceDays=Math.max(1,Math.min(365,n));
  else if(field==='noticeHours'||field==='cancelHours')R[field]=Math.max(0,Math.min(168,n));
  else if(field==='lateFeePct'||field==='noShowFeePct')R[field]=Math.max(0,Math.min(100,n));
  else if(field==='minGap')R.minGap=Math.max(0,Math.min(240,n));   /* the business-wide break between two lessons in one session; 0 = none anywhere */
  else if(field==='holdDays')R.holdDays=Math.max(1,Math.min(30,n));   /* B5: how long a dated hold keeps a slot, counted back from the lesson */
  else return false;
  return true;
}

/* ---------------------------------------------------------------------------

/* §2.2/§5: the customer calendar reads the SERVER, not this browser's copy.

   changes; each server run is materialised as a local shift marked srv, which is what shiftOf() and

/* ---------- administrative shortcut: Manager and Super user only, on every page except the one it points to ---------- */
/* The app's two supervisor tiers: Manager and Super user (whose internal role is 'owner').
   ONE definition - every "may this person supervise?" test goes through here. This idea used to
   be written four different ways, and one of them named an 'admin' role that exists nowhere. */
/* ---------- what a person HOLDS (roles §11) ----------
   The one place that answers "which jobs does this person hold?", so the nav, the pages and the
   supervision test all read the SAME answer instead of each testing a role and drifting apart.
   The job sets themselves are JOBNAV / JOBPAGES, declared once. */
function jobsHeld(u){
  u=u||me();if(!u)return [];
  if(u.platform||u.role==='platform')return ['platform'];
  if(u.role==='customer')return ['consume'];
  var j=[];
  /* Run and the people page are held by a CAPABILITY now, not by being the manager tier (§2.3).
     The super user holds Run by being the super user; everyone else holds it by a grant - which is
     exactly what the 'Manager' classification carries as its preset, so a person classified
     Manager keeps everything a manager had without the code knowing the word "manager" at all. */
  if(u.role==='owner'||hasGrant('run',u))j.push('run');
  if(hasGrant('team',u))j.push('team');
  if(canRules())j.push('decide');               /* policy is held by grant, not by rank (§12) */
  if(iTeach())j.push('teach');                  /* being bookable is an identity, not a rank */
  return j;
}
/* §2.3: supervision is a CAPABILITY, not a role test - "canSupervise() (owner-or-manager today)
   becomes a capability check". It is exactly the people who hold Run, said in those words. */
function canSupervise(){return jobsHeld().indexOf('run')>=0}
/* ---------- §2.3: the Manager tier is retired, and existing managers are MIGRATED, not dropped ----------
   Every record still saying role 'manager' becomes an ordinary employee carrying a 'Manager'
   CLASSIFICATION, and that classification carries the preset of capabilities (MGRPRESET). The person
   therefore keeps exactly the access a manager had, while nothing in the code tests for the word
   "manager" any more. The classification is the reusable form: the next person the business wants to
   manage is given the same classification and inherits the same preset with no code change - which is
   the point of §12's "a grant may name one person or a whole classification".
   Idempotent and cheap: it does nothing at all to a business with no such record. It runs before the
   first paint, so no screen is ever drawn from an un-migrated record. */
function migrateManagerTier(){
  var changed=0;
  Object.keys(DB.biz||{}).forEach(function(bk){
    var b=DB.biz[bk],legacy=(b.users||[]).filter(function(u){return u.role==='manager'});
    if(!legacy.length)return;
    var owner=(b.users||[]).filter(function(u){return u.role==='owner'})[0];
    /* the classification the retired tier becomes. NOT bookable: it is access, not a service, so nobody
       classified Manager can ever be offered to a customer as a provider. */
    var cls=(b.classes||[]).filter(function(c){return c.name===MGRCLASS})[0];
    if(!cls){b.classes=b.classes||[];cls={id:b.id+'-cmgr',name:MGRCLASS,bookable:false,reqCert:''};b.classes.push(cls)}
    var loc=(b.locations||[])[0],locId=loc?loc.id:null;
    legacy.forEach(function(u){
      u.role='employee';
      var s=u.staffId?staffOf(u.staffId):null;
      if(!s){   /* the record the classification has to live on */
        var sid=u.id+'-smgr';
        b.staff.push({id:sid,name:u.name,title:MGRCLASS,c:'e9',phone:'',maxHours:40,payCents:0,cls:[cls.id],locs:locId?[locId]:[],active:true,certs:[]});
        b.avail[sid]=b.avail[sid]||{};b.pref[sid]=b.pref[sid]||{};
        u.staffId=sid;
      } else if((s.cls||[]).indexOf(cls.id)<0)s.cls.push(cls.id);
      changed++;
    });
    /* the preset goes on the CLASSIFICATION, not on each person: one row covers this manager and every
       future person the business classifies the same way. No cascade - the classification holds it. */
    b.grants=b.grants||[];
    MGRPRESET.forEach(function(cap){
      var exists=b.grants.some(function(g){return g.cap===cap&&g.to==='class'&&g.id===cls.id});
      if(!exists)b.grants.push({cap:cap,to:'class',id:cls.id,by:(owner||{}).id||'',at:TODAY});
    });
  });
  if(changed)save();
  return changed;
}

/* ---------- live registration: POST /api/v1/tenant/register ----------
   Turned on by the page that hosts this script:   window.OMNIGRID_API_BASE = ''            (same origin)  or  'https://api.example.com'
   Not set (as in this prototype page): the business is created inside this browser instead.
   The request carries exactly six fields and NEVER a business_id: the server makes the id and sends it back. The authentication token is kept
   in memory only (REMOTE), never written to localStorage; the non-secret business_id is kept on the session profile (DB.session.bid). */
var REMOTE=null;   /* { token, businessId } for this page visit */
var REMOTE_TIMEOUT_MS=15000,UUID_RE=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

  return {business_name:String(o.name||'').trim(),business_code:slugify(o.slug||o.name),industry:pubVertical(),owner_name:String(o.owner||'').trim(),email:String(o.email||'').trim().toLowerCase(),password:String(o.pw||'')};

function checkRegistrationReply(r,payload){
  return !!r&&typeof r.business_id==='string'&&UUID_RE.test(r.business_id)&&typeof r.token==='string'&&r.token.length>=20&&r.token.length<=200&&
    !!r.business&&r.business.slug===payload.business_code&&!!r.user&&r.user.role==='owner';

function randomLocalSecret(){

/* Resolves to '' on success or the message to show. Never rejects. */

  var payload=registrationPayload(o);
  if(!payload.business_name||!payload.owner_name)return Promise.resolve('Enter the business name and your name.');
  if(String(payload.password).length<8)return Promise.resolve('Use a password of at least 8 characters.');

  return fetch(base+'/api/v1/tenant/register',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload),credentials:'omit',signal:ctl?ctl.signal:undefined})
    .then(function(res){return res.text().then(function(t){var j=null;try{j=t?JSON.parse(t):null}catch(e){}return {status:res.status,body:j}})})
    .then(function(r){

      if(r.status===429)return 'Too many sign-ups from this connection. Please try again later.';

        var local=randomLocalSecret(),err=createBusiness({name:payload.business_name,slug:payload.business_code,owner:payload.owner_name,email:payload.email,pw:local,vertical:payload.industry});
        if(err)return 'Your business was created on the server, but this browser already has a business with that code. Sign in instead.';
        if(!signIn(payload.business_code,payload.email,local))return 'Your business was created. Please sign in with your new code.';
        DB.session.bid=r.body.business_id;                       /* non-secret, saved with the session profile */
        REMOTE={token:r.body.token,businessId:r.body.business_id};   /* secret, memory only */
        var mine=B();if(mine)mine.remoteId=r.body.business_id;
        setVertical(payload.industry);                           /* the omnigrid_pitch_industry cookie */
        SYNC={state:'loading',msg:''};setTimeout(hydrateFromServer,0);   /* the page now shows what the server holds, not the starter sample */
        return '';

    },function(){

function remoteSession(){return REMOTE?{businessId:REMOTE.businessId,hasToken:true}:null}   /* never hands the token itself to the screen */

/* ---------- server link: write-through to the live API (only while a server base URL is set AND this visit holds a server token) ---------- */
/* serverMode(): true when the host page set window.OMNIGRID_API_BASE. serverLive(): true when this visit also holds a registered owner's token. The business id is never sent: the token carries it. */
function serverMode(){return remoteBase()!==null}

/* PAYMENT PREFERENCES, fetched once and kept. The checkout renders from this: which ways to pay the

/* MILESTONE STATE (§12.14). The server holds the authority - it counts the completed bookings and
   applies the business's own strategy - and this is only a cache of its answer, asked once per swimmer.
   The offline single-file copy has no server, so the same rule is counted from this browser's own
   bookings: completed, or attended. */
var MILESTONES={};
function loadMilestone(pid){
  if(!pid||!serverLive()||MILESTONES[pid]||MILESTONES['_p'+pid])return;
  MILESTONES['_p'+pid]=true;
  remoteCall('GET','/api/v1/consumers/'+encodeURIComponent(pid)+'/milestone').then(function(r){
    if(r&&r.status===200&&r.body){MILESTONES[pid]=r.body;try{paint()}catch(e){}}

  },function(){MILESTONES['_p'+pid]=false});

function milestoneOf(pid){
  if(!pid)return null;
  if(serverLive())return MILESTONES[pid]||null;
  var n=0;
  (B().book||[]).forEach(function(k){if(k.pid===pid&&(k.status==='completed'||k.att==='done'))n++});
  var cp=B().creditSharing||{};
  var thr=(Number.isFinite(Number(cp.sharingMilestoneThreshold)))?Number(cp.sharingMilestoneThreshold):36;
  var strat=cp.creditSharingStrategy||'tiered_milestone';
  if(strat==='full_family')return {person_id:pid,completed:n,threshold:thr,strategy:strat,shared:true,locked:false};
  if(strat==='strict_swimmer')return {person_id:pid,completed:n,threshold:thr,strategy:strat,shared:false,locked:true};
  return {person_id:pid,completed:n,threshold:thr,strategy:strat,shared:n>=thr,locked:n<thr,remaining:Math.max(0,thr-n)};

/* Resolves to {status,body}; never rejects. Resolves to null when there is no live server session (prototype mode). */

    .then(function(res){return res.text().then(function(t){var j=null;try{j=t?JSON.parse(t):null}catch(e){}if(timer)clearTimeout(timer);return {status:res.status,body:j}})})

/* the three saved rule fields of a service: whole numbers only. Fields the super user never set are left out, so the server keeps its defaults. */
function serviceRuleFields(sv){

       people and the things it sells. The page was falling back to the generic pack - which is what
       made a swim school say "Book a booking" and "My consumers". The pack is applied from the
       server's industry, then the server's own labels win over it: that is where "Instructor",
       "Swimmer" and "Lesson" come from. Always applied, so a change made in the business's settings

/* POST a JSON body and normalise the answer to {status, body}, so every server call in this file

    .then(function(res){return res.text().then(function(t){var j=null;try{j=t?JSON.parse(t):null}catch(e){}if(timer)clearTimeout(timer);return {status:res.status,body:j}})});

/* =====================================================================
   Availability windows. No shift containers: a person publishes free-form windows built from
   10-minute blocks, and can drag, resize, split, hold back or clear them on the daily calendar.
   x.sm / x.em are the minutes (source of truth); x.s / x.e are the same in hours for the staffing planner.
   Mirrors the backend (db/007_availability_windows.sql, src/suite.js).

var BLK=10;

function addWindow(date,loc,sid,sm,em,cid,online){
  var x={id:uid('sh'),date:date,loc:loc,sid:sid,sm:sm,em:em,cls:cid||B().classes[0].id};
  if(online===false)x.online=false;

/* bring older data (hour shifts, 30-minute blocked cells) into windows */
function normAll(db){

}
function normBiz(b){

  (b.services||[]).forEach(function(sv){if(sv.min%10)sv.min=Math.min(240,Math.ceil(sv.min/10)*10)});
  b.shifts.forEach(function(x){
    if(x.sm==null){x.sm=Math.round(x.s*60);x.em=Math.round(x.e*60)}

      for(var m=x.sm;m<x.em;m+=BLK){var h=held(m);if(cur&&cur.h===h)cur.e=m+BLK;else{cur={s:m,e:m+BLK,h:h};runs.push(cur)}}
      runs.forEach(function(r,i){
        var piece=i===0?x:{id:uid('sh'),date:x.date,loc:x.loc,sid:x.sid,cls:x.cls};
        piece.sm=r.s;piece.em=r.e;if(r.h)piece.online=false;else delete piece.online;syncWin(piece);if(i>0)add.push(piece);
      });

}
function dayWins(sid,date,b){return (b||B()).shifts.filter(function(w){return w.sid===sid&&w.date===date})}

    if(w.sm<from){var l=Object.assign({},w);l.em=from;out.push(l)}
    if(to<w.em){var r=Object.assign({},w);r.id=w.sm<from?null:w.id;r.sm=to;out.push(r)}

/* make one person's day equal `desired`, keeping row ids wherever a window survives so a drag keeps its identity */
function setDay(sid,date,desired){
  var have=dayWins(sid,date),used={},todo=tidyW(desired),left=[],pending=[];
  var same=function(e,d){return e.sm===d.sm&&e.em===d.em&&sameAttr(e,d)};
  todo.forEach(function(d){
    var e=have.filter(function(x){return !used[x.id]&&(d.id?x.id===d.id:true)&&same(x,d)})[0]||have.filter(function(x){return !used[x.id]&&same(x,d)})[0];
    if(e)used[e.id]=1;else left.push(d);

  left.forEach(function(d){
    var e=(d.id&&have.filter(function(x){return !used[x.id]&&x.id===d.id})[0])||have.filter(function(x){return !used[x.id]&&sameAttr(x,d)&&x.sm<d.em&&d.sm<x.em})[0];

    else pending.push(d);

/* bookings follow the window that now contains them */

/* run an edit on some people-days; undo it all if a booking would be left outside the available times */

  var res=fn();
  if(res&&res.err){winRestore(snap);return res}
  var bad=null;
  days.forEach(function(d){if(!bad){var u=uncoveredBookings(d[0],d[1]);if(u.length)bad=u[0]}});
  if(bad){winRestore(snap);return {err:'A booking ('+fm(bad.t)+', '+bad.client+') would be left outside the available times. Cancel or move it first'}}

function winCheck(sid,date,loc,cls,sm,em){

  if(!approved(s,loc))return s.name+' is not approved for this site';
  if(cl&&!hasCls(s,cl.id))return s.name+' is not classified as '+cl.name;
  if(cl&&cl.reqCert){var c=certFor(s,cl.reqCert);if(!c)return s.name+' needs a '+cl.reqCert+' certificate for '+cl.name;if(pd(c.exp)<pd(date))return s.name+"'s "+cl.reqCert+' is expired on that date'}

  (ui.cdays||[]).forEach(function(di){if(di===cur||di<0||di>6)return;var dt=ds(addD(pd(date),di-cur)),H=hoursFor(dt,ui.loc);if(!H){skip++;return}var a=Math.max(lo,H.o*60),z=Math.min(hi,H.c*60);if(z-a<BLK){skip++;return}var r=winPublish(sid,dt,ui.loc,winClassFor(sid),a,z,true);if(r&&r.err)skip++;else n++});
  return {n:n,skip:skip};
}
function endDrag(e,cancel){
  var d=cdrag;if(!d)return;cdrag=null;stopAutoScroll();
  document.querySelectorAll('.cghost').forEach(function(g){g.remove()});
  if(cancel)return;
  var changed=false;
  if(d.k==='move'||d.k==='rs'||d.k==='re'){
    if(!d.moved){ui.cwin=ui.cwin===d.id?null:d.id;changed=true}
    else{var tc=d.tcol||d.col,rg=dragRange(d);changed=true;winOp({op:'move',id:d.id,sid:tc.dataset.sid,date:tc.dataset.d||d.date,sm:rg.sm,em:rg.em})}
  }else{
    var rg2=dragRange(d),lo=rg2.sm,hi=rg2.em;
    if(d.k==='demand'){var Hd=hoursFor(d.date,ui.loc),ds0=Hd?Math.max(lo,Hd.o*60):lo,de0=Hd?Math.min(hi,Hd.c*60):hi;if(!Hd||de0<=ds0)toast('Draw inside the open hours');else ui.dmodal={date:d.date,sm:ds0,em:de0};changed=true}
    else if(d.k==='paint'){if(d.moved)paintCommit(d.sid,d.date,lo,hi,false);else paintShift(d.sid,d.date,d.m0);changed=true}
    else if(d.k==='publish'&&d.moved&&d.outside&&me().role!=='employee'){ui.pwarn={sid:d.sid,date:d.date,sm:lo,em:hi,tool:'publish'};changed=true}
    else if(d.k==='publish'&&d.moved&&d.blocked){var sb=staffOf(d.sid);toast('The site is closed that day'+(sb?' for '+sb.name:'')+'. Nothing was added');changed=true}
    else if(d.moved||d.k!=='publish'){var okp=winOp({op:d.k,sid:d.sid,date:d.date,sm:lo,em:hi});if(d.k==='publish'&&okp&&(ui.cdays||[]).length){var sp2=calSpread(d.sid,d.date,lo,hi);if(sp2.n||sp2.skip)toast('Also added on '+sp2.n+' more day'+(sp2.n===1?'':'s')+(sp2.skip?'; '+sp2.skip+' skipped (closed or conflict)':''))}changed=true}
    else if(d.k==='publish'){openAdd(d.sid,d.date,lo);changed=true}
  }
  if(changed){save();paint()}
}
document.addEventListener('pointerup',function(e){endDrag(e,false)});
document.addEventListener('pointercancel',function(e){endDrag(e,true)});
window.addEventListener('blur',function(e){endDrag(e,true)});   /* losing the window mid-drag ends the drag and the scroll loop instead of leaving them running */
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&cdrag){endDrag(e,true)}
  else if(e.key==='Escape'&&ui.page==='calendar'&&calTool()==='assign'&&ui.brush){ui.brush=null;paint()}   /* Esc puts the paintbrush down */
  var t=e.target;if(t&&t.classList&&t.classList.contains('cwin')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();if(calTool()==='assign'){if(assignBlock(t.dataset.id))save();paint()}else{ui.cwin=ui.cwin===t.dataset.id?null:t.dataset.id;paint()}}
});

function createBusiness(r){
  var slug=String(r.slug||'').trim().toLowerCase(),nm=String(r.name||'').trim(),em=String(r.email||'').trim().toLowerCase(),on=String(r.owner||'').trim();
  if(!nm||!on)return 'Enter the business name and the super user’s name.';
  if(!/^[a-z0-9][a-z0-9-]{1,30}$/.test(slug)||slug===PLAT_SLUG)return 'The business code needs 2 to 31 letters, numbers or dashes.';
  if(allBiz().some(function(b){return b.slug===slug}))return 'That business code is taken.';
  if(em.indexOf('@')<1)return 'Enter a valid email for the super user.';
  if(allBiz().some(function(b){return b.users.some(function(u){return u.email===em})}))return 'That email already has an account in another business.';
  if(String(r.pw||'').length<8)return 'Use a temporary password of at least 8 characters.';
  var id='b'+uid('').slice(0,6);
  /* The public sign-up picks an industry wording. It takes the whole pack, not a hand-picked
     four words: packLabels carries place/group/week/package and the course and stage too, so a
     business created here reads as its own industry everywhere the page says a word. */
  var b=mkBiz({id:id,slug:slug,name:nm,labels:packLabels(r.vertical),
    locs:[['Main site','',wk([9,17],[9,17],null),[[9,17,1,1]]]],
    services:[['Standard booking',30,3000]],classes:[['Staff',true,'']],
    owner:[on,em],manager:['x','x@x'],customer:['x','y@y'],staff:[]});
  b.users=[{id:id+'-uo',email:em,name:on,role:'owner',pw:r.pw}];
  b.status='active';b.created=ds(T0);if(r.vertical)b.vertical=cleanVertical(r.vertical);
  DB.biz[id]=b;audit('Created business',nm,'Code '+slug+', super user '+em);
  return '';
}

/* the first page staff land on: the calendar for appointment businesses (the default), or the overview */
/* the first page a person lands on: whatever their own nav offers first. navFor already applies the
   calendar-first rule for the businesses that asked for it, so this no longer repeats it - and it no
   longer names a role, which is what left it reaching for a 'manager' entry that no longer exists. */
function homeOf(role){var n=navFor(role);return n.length?n[0][0]:'calendar'}
/* The LENS the nav is resolved through. Someone who holds a business job as well as Teach chooses with
   the Teaching / Business switch; someone whose ONLY job is Teach is always in the teaching lens,
   because there is nothing to switch to. ONE place, so the pages and the words on them cannot disagree -
   the nav and its labels both read this rather than testing a role. */
function lensJobs(u){
  u=u||me();if(!u)return [];
  var j=jobsHeld(u);
  if(!j.length)return [];
  if(j.indexOf('run')>=0||j.indexOf('decide')>=0)
    return (iTeach()&&ui.hat==='teach')?['teach']:j.filter(function(x){return x!=='teach'});
  return j;
}
/* true when the nav on screen is the teaching lens - which is what makes the calendar "My availability"
   rather than "Calendar". A manager is not a role any more, so this cannot be a role test. */
function teachingLens(){var j=lensJobs();return j.length===1&&j[0]==='teach'}
function navFor(role){
  /* §2.3, §11, §3: the nav is built from what the person HOLDS, not from the role they are called.

/* Every period this cart touches must meet the pack's rule, counting bookings already made with that pack.
   The last stretch may fall short when the cart spends the pack's final credits. */
function commitProblems(plan){
  var probs=[],g={};
  plan.rows.forEach(function(r){if(r.pk&&r.pk.rule&&r.pk.need){g[r.pk.id]=g[r.pk.id]||{pk:r.pk,dates:[]};g[r.pk.id].dates.push(r.it.x.date)}});
  var counted={};plan.rows.forEach(function(r){if(r.pk&&r.pk.firstMin){counted[r.pk.id]=counted[r.pk.id]||{pk:r.pk,n:0};counted[r.pk.id].n++}});
  Object.keys(counted).forEach(function(id){
    var pk=counted[id].pk,n=counted[id].n,u=me();
    var used=B().book.some(function(k){return k.credit===pk.id&&k.status!=='cancelled'});
    if((used&&!pk.firstEvery)||(pk.firstOnly&&!firstTimer(u,pk)))return;
    var need=Math.min(pk.firstMin,pk.left);
    if(n<need)probs.push({pk:pk,key:'first',have:n,text:pk.name+': '+(pk.firstEvery?'each checkout':'your first checkout')+' needs at least '+need+' sessions booked ('+n+' selected)'});
  });
  Object.keys(g).forEach(function(id){
    var pk=g[id].pk,dates=g[id].dates,have={},touched={};
    B().book.forEach(function(k){if(k.credit===pk.id&&k.status!=='cancelled'){var kk=periodKey(pk.rule,k.date);(have[kk]=have[kk]||[]).push(k.date)}});
    dates.forEach(function(d){var kk=periodKey(pk.rule,d);touched[kk]=1;(have[kk]=have[kk]||[]).push(d)});
    var usesAll=pk.left-dates.length<=0;
    Object.keys(touched).forEach(function(kk){
      var list=have[kk],n=pk.rule==='week'?list.filter(function(d,i){return list.indexOf(d)===i}).length:list.length;
      if(n<pk.need&&!usesAll)probs.push({pk:pk,key:kk,have:n,text:pk.name+': '+periodLabel(pk.rule,kk)+' has '+n+' of the '+pk.need+' '+(pk.rule==='week'?'days':'sessions')+' required'});
    });
  });
  return probs;
}

/* extra lengths and prices for one service (rows can be added and removed; a length row is settings, not history, so removing one never touches past bookings) */
/* ---- validation for lengths and prices: nothing is saved until it passes, and the reason is said in plain words ---- */
/* a price typed by a person: "" and spaces are empty, "-5" is negative, "12.505" is rounded to cents. Returns {ok:true,cents} or {ok:false,why} */
function parsePrice(raw){
  var t=String(raw==null?'':raw).trim().replace(/^\$/,'');
  if(t==='')return {ok:false,why:'Enter a price (0 for free)'};
  if(!/^-?\d*\.?\d+$|^-?\d+\.$/.test(t))return {ok:false,why:'The price must be a number, like 35 or 12.50'};
  var n=+t;
  if(n<0)return {ok:false,why:'A price cannot be negative'};
  if(n>100000)return {ok:false,why:'That price is too large'};
  return {ok:true,cents:Math.round(n*100)};
}
/* a length in minutes: whole 10-minute steps from 10 to 240 */
function parseMinutes(raw){
  var t=String(raw==null?'':raw).trim();
  if(t==='')return {ok:false,why:'Enter the length in minutes'};
  if(!/^-?\d+$/.test(t))return {ok:false,why:'The length must be a whole number of minutes'};
  var n=+t;
  if(n<10||n>240)return {ok:false,why:'Length must be between 10 and 240 minutes'};
  if(n%10)return {ok:false,why:'Lengths go in 10-minute steps (10, 20, 30...)'};
  return {ok:true,min:n};
}
/* every length row of a service (main first, then the extra rows) must be valid and unique. rows = [{min:raw,price:raw}]. Returns '' when fine, else the first problem. */
function lengthsProblem(mainMinRaw,mainPriceRaw,rows,needMainPrice){
  var seen={},m=parseMinutes(mainMinRaw);
  if(!m.ok)return m.why;seen[m.min]=1;
  if(needMainPrice){var mp=parsePrice(mainPriceRaw);if(!mp.ok)return mp.why}
  for(var i=0;i<rows.length;i++){
    var rm=parseMinutes(rows[i].min),rp=parsePrice(rows[i].price),tag='Length row '+(i+1)+': ';
    if(!rm.ok)return tag+rm.why;
    if(!rp.ok)return tag+rp.why;
    if(seen[rm.min])return tag+rm.min+' minutes is already listed';
    seen[rm.min]=1;
  }
  return '';
}

function moreBlock(id){

/* ---------- bookings: attendance and cancellation classes ---------- */
var CANCEL_LBL={ontime:'Cancelled in time',late:'Late cancel',noshow:'No-show',staff:'Cancelled by us'};

/* ---------- B5 (12.4): a booking that WAITS ----------
   One mechanism, three release conditions: an UNPAID one released when the money lands, a
   DATED one released when the day arrives, an APPROVAL one released by a person deciding.
   Stored as k.hold={why,at,until}. k.status is deliberately left alone, so nothing that
   already reads a booking's state has to learn a new word. */

var HOLD_NAME={holdUnpaid:'Payment',holdDate:'A dated hold',holdApproval:'Approval'};
function heldOf(k){return (k&&k.hold&&k.hold.why)?k.hold:null}
/* The release happens BY ITSELF - nobody has to remember to look. Returns what came free. */
function releaseHolds(){
  var out=[];B().book.forEach(function(k){
    var h=heldOf(k);if(!h||k.status==='cancelled')return;
    if(h.why==='date'&&h.until&&h.until<=TODAY){k.hold=null;out.push(k)}
    else if(h.why==='unpaid'&&k.paid){k.hold=null;out.push(k)}
  });
  return out;
}
/* Which flavours this business has chosen. One switch per flavour, so a business on a
   monthly allowance can leave the unpaid hold off entirely (12.9). */
function holdWhyOn(why){var R=B().rules||{};if(!R.holdOn)return false;return !!{unpaid:R.holdUnpaid,date:R.holdDate,approval:R.holdApproval}[why]}
function holdDays(){var n=Math.round(+(B().rules||{}).holdDays);return isFinite(n)&&n>0?Math.min(30,n):10}
/* The last day a dated hold may keep a slot, counted back from the lesson itself. */
function holdUntil(date){return ds(addD(pd(date),-holdDays()))}
/* Put a booking on hold. Returns the hold, or null when this business has it switched off. */
function holdBooking(k,why){
  if(!k||!holdWhyOn(why))return null;
  var h={why:why,at:TODAY,until:why==='date'?holdUntil(k.date):null};
  k.hold=h;return h;
}
function feeFor(k,type){var R=B().rules,pct=type==='late'?R.lateFeePct:type==='noshow'?R.noShowFeePct:0;return Math.round((k.price||0)*(pct||0)/100)}

function settle(k,type){var fee=feeFor(k,type);k.fee=fee;k.refund=(k.paid&&!k.credit)?Math.max(0,(k.price||0)-fee):0;k.feeDue=k.paid?0:fee}

  /* a package credit comes back unless a fee applies (late cancel with a fee uses the credit) */
  if(k.credit&&!(k.fee>0)){var ow=B().users.filter(function(u){return u.id===k.cust})[0],pk=ow&&(ow.packs||[]).filter(function(p){return p.id===k.credit})[0];if(pk&&pk.left<pk.total){pk.left++;k.creditBack=true}}

function bookBadge(k){

function gapSegs(x,a,b){
  var out=[],m=a;
  while(m<b){var nx=Math.min(b,(Math.floor(m/CELL)+1)*CELL),blk=isBlocked(x,Math.floor(m/CELL)*CELL),last=out[out.length-1];
    if(last&&last.blocked===blk&&last.t1===m)last.t1=nx;else out.push({kind:blk?'blocked':'open',blocked:blk,t0:m,t1:nx});m=nx}
  return out;
}
function segsOf(x){
  var live=bookingsFor(x.id).sort(function(a,b){return a.t-b.t}),out=[],cur=x.sm,end=x.em;
  live.forEach(function(k){if(k.t>cur)out=out.concat(gapSegs(x,cur,k.t));out.push({kind:'book',t0:k.t,t1:k.t+k.len,k:k});cur=Math.max(cur,k.t+k.len)});
  if(cur<end)out=out.concat(gapSegs(x,cur,end));
  return out;
}

/* ---------- PACKAGES (bundles of sessions) and the booking cart ---------- */
function pkgOf(id){return (B().packages||[]).filter(function(p){return p.id===id})[0]}
function activePkgs(){return (B().packages||[]).filter(function(p){return p.active})}
function perSession(p){return Math.round(p.cents/p.qty)}
function packLive(pk){return pk.left>0&&pk.exp>=TODAY}
function packValue(pk){return Math.round(pk.paid/pk.total)}
function pkgScope(p){var s=p.svc&&svcOf(p.svc);return s?s.name:'Any service'}
/* the live pack that should pay for a service: soonest to expire first. `used` counts credits already
   earmarked in this cart.
   §12.14 ENFORCEMENT, deliberately a condition in this scan rather than a new structure: a pack carrying
   a swimmerId belongs to that swimmer. It may always pay for them, and may pay for anyone else only once
   that swimmer has graduated. Whether they have is not decided here - it is whatever strategy the
   business set, resolved by the same milestone the server counts - so a sibling can never quietly draw
   another child's intro credits, and the moment that child graduates those credits join the household
   pool by themselves. A pack with no swimmerId is a family pack and is shared exactly as before. */
function packFor(u,svcId,used,pid){
  var best=null;
  (u.packs||[]).forEach(function(pk){
    if(!packLive(pk)||(pk.svc&&pk.svc!==svcId))return;
    if(pk.left-((used&&used[pk.id])||0)<=0)return;
    if(!packMayPayFor(pk,pid))return;
    if(!best||pk.exp<best.exp)best=pk;
  });
  return best;
}
/* May this credit pay for this swimmer? */
function packMayPayFor(pk,pid){
  var owner=pk&&pk.swimmerId;
  if(!owner)return true;                              /* a family pack: anyone may draw on it */
  if(pid&&String(pid)===String(owner))return true;    /* always its own swimmer's to use */
  var m=milestoneOf(owner);
  if(!m)return false;                                 /* not answered yet: fail closed, never open */
  return !!m.shared;                                  /* graduated -> it joins the household pool */
}
function creditsFor(u,svcId){var n=0;(u.packs||[]).forEach(function(pk){if(packLive(pk)&&(!pk.svc||pk.svc===svcId))n+=pk.left});return n}
function buyPack(pkgId,forPid){
  var p=pkgOf(pkgId),u=me();if(!p||!p.active||u.role!=='customer')return null;
  /* §12.14: an intro / survival package is bought FOR a swimmer, and those credits are theirs. A
     continuing package is the household's and carries no owner at all, which is what makes it drawable
     by everyone. An intro package with no swimmer named is REFUSED rather than guessed at: it would
     silently become communal, which is the very thing §12.14 exists to prevent. */
  var intro=!!(p.route?p.route==='intro':p.firstOnly);
  if(intro&&!forPid){toast('Choose which swimmer this '+(p.name||'course')+' is for first');return null}
  u.packs=u.packs||[];
  var pk={id:uid('pk'),pkgId:p.id,name:p.name,svc:p.svc||'',total:p.qty,left:p.qty,paid:p.cents,bought:TODAY,exp:ds(addD(T0,p.days)),rule:p.rule||'',need:p.need||0,firstMin:p.firstMin||0,firstOnly:!!p.firstOnly,firstEvery:!!p.firstEvery,swimmerId:intro?(forPid||null):null};
  u.packs.push(pk);return pk;
}
/* ----- cart: several times in one visit ----- */
function cartItems(){return (ui.cart||[]).map(function(c){var x=shiftOf(c.id),sv=svcVar(svcOf(c.svc),c.len);return x&&sv?{c:c,x:x,sv:sv}:null}).filter(Boolean)}
function cartHas(id,t){return (ui.cart||[]).some(function(c){return c.id===id&&c.t===t})}
function cartToggle(id,t){
  ui.cart=ui.cart||[];
  for(var i=0;i<ui.cart.length;i++)if(ui.cart[i].id===id&&ui.cart[i].t===t){ui.cart.splice(i,1);return}
  var x=shiftOf(id),sv=svcOf(ui.cs);if(!x||!sv)return;

  var clash=ui.cart.some(function(c){var s2=svcOf(c.svc);return c.id===id&&s2&&t<c.t+(c.len||s2.min)&&c.t<t+sv.min});
  if(clash){toast('That overlaps another time you picked');return}
  ui.cart.push({id:id,t:t,svc:sv.id,len:sv.min,pid:null});
}
function cartPlan(){
  var u=me(),used={},rows=[],due=0;
  cartItems().forEach(function(it){
    var pk=(ui.useCredits===false||it.sv.variant)?null:packFor(u,it.sv.id,used,it.c.pid);
    if(pk)used[pk.id]=(used[pk.id]||0)+1;else due+=it.sv.cents;
    rows.push({it:it,pk:pk});
  });
  var plan={rows:rows,due:due,credits:rows.filter(function(r){return r.pk}).length};plan.problems=commitProblems(plan).concat(limitProblems(plan)).concat(sequenceProblems(plan));return plan;
}
function payCart(){
  var u=me(),plan=cartPlan();
  if(!B().rules.onlineOn||!plan.rows.length)return;
  u.people=u.people||[];

document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ui.drawer){ui.drawer=null;paint()}});
/* Employee form: Tab and Shift+Tab stay inside the form. From the last control Tab wraps to Full name; from Full name Shift+Tab wraps to the last control, so focus can never jump up to the Hermes rail. Esc cancels the form. */
document.addEventListener('keydown',function(e){
  var fm=e.target&&e.target.closest?e.target.closest('form[data-f="addStaff"]'):null;if(!fm)return;
  if(e.key==='Escape'){e.preventDefault();ui.addStaff=false;ui.ns=null;paint();return}
  if(e.key!=='Tab'||e.altKey||e.ctrlKey||e.metaKey)return;
  var f=[].filter.call(fm.querySelectorAll('input,select,textarea,button,a[href]'),function(x){return !x.disabled&&x.tabIndex>=0&&x.offsetParent!==null});
  if(!f.length)return;var a=f[0],z=f[f.length-1];
  if(e.shiftKey&&e.target===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&e.target===z){e.preventDefault();a.focus()}
});
window.addEventListener('hashchange',function(){
  if(!DB||!DB.session)return;var p=location.hash.slice(1);
  if(DB.session.platform){if(p&&PLATPAGES[p]&&p!==ui.page){ui.page=p;paint()}return}
  var r=me().role;
  if(p&&PAGES[r][p]&&p!==ui.page){ui.page=p;ui.drawer=null;paint()}
});

function setViewAs(id){
  if(!DB.session||DB.session.platform||realMe().role!=='owner')return;
  if(!id){delete DB.session.as}
  else{var t=B().users.filter(function(x){return x.id===id})[0];if(!t||t.role==='owner')return;DB.session.as=id}
  resetView();ui.page=homeOf(me().role);setHash(ui.page);
}
load();
if(DB.session&&DB.session.platform){ui.page=PLATPAGES[location.hash.slice(1)]?location.hash.slice(1):NAV.platform[0][0]}
else if(DB.session&&DB.biz[DB.session.biz]){
  /* §2.3: retire the manager tier in the DATA before anything reads a role - the lines below index
     PAGES and NAV by role, and there is no longer a 'manager' entry to find. Idempotent; a no-op once done.
     NOTE: this hook belongs HERE, in events_new.js, NOT in the tail of portals2.js - the build
     regenerates that tail from this file, so a call written there is silently dropped. */
  migrateManagerTier();
  CURB=DB.biz[DB.session.biz];
  var hp=location.hash.slice(1),r0=me()&&me().role;
  if(!r0){DB.session=null;CURB=null}else{ui.loc=activeLocs()[0].id;ui.page=(hp&&hp!=='client'&&PAGES[r0][hp])?hp:homeOf(r0)}
}else{DB.session=null}
paint();

/* ---------- THE DESK (step 4) ----------------------------------------------------------------
 Two controls a provider can actually press, both reading and writing the server and nothing else:
   - the outstanding balances, each with Mark received, which writes the books row
   - the upcoming appointments as a checklist, by date and time, with Select all, for when a child
     is away for a fortnight - and the customer is told the moment the removal lands.
 Server mode only. The offline single file keeps its own local paths and never shows this. */
function deskFetch(path,method,payload){
if(!serverMode()) return Promise.reject(new Error('This page is not connected to a server.'));
return fetch(remoteBase()+path,{method:method||'GET',headers:{'content-type':'application/json','authorization':'Bearer '+REMOTE.token},body:payload==null?undefined:JSON.stringify(payload),credentials:'omit'})
  .then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(!r.ok)throw new Error((j&&j.error&&(j.error.message||j.error))||('Request failed ('+r.status+')'));return j})});
}
function deskCard(){
if(!serverMode()) return '';
return '<div class="card" id="deskCard" style="margin-top:14px;display:grid;gap:10px">'
 +'<div class="row" style="justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">'
 +'<div><h3 style="margin:0">The desk</h3><div class="muted sm">Cash and Venmo balances, and the appointments behind them.</div></div>'
 +'<button class="btn pri" data-desk="load" style="min-height:48px;padding:12px 18px">Open the desk ledger</button>'
 +'</div><div id="deskBody" style="display:none;gap:12px"></div></div>';
}
function deskTime(x){var d=x&&x.starts_at?new Date(x.starts_at):null;if(!d||isNaN(d))return '';return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})+' at '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}
function deskLoad(){
var el=document.getElementById('deskBody'); if(!el) return;
el.style.display='grid'; el.innerHTML='<p class="sm muted">Loading the desk…</p>';
deskFetch('/api/v1/ledger').then(function(L){
  var out=(L.outstanding||[]);
  var h='<div class="card" style="display:grid;gap:8px"><div class="row" style="justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">'
    +'<div><div class="eyebrow">Owed to you</div><b class="mono" style="font-size:22px">'+money(L.total_outstanding_cents||0)+'</b></div>'
    +'<div class="sm muted">'+out.length+' booking'+(out.length===1?'':'s')+' not yet paid</div></div>';
  h+= out.length? out.map(function(x){
    return '<div class="row" style="justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:8px">'
     +'<div><b>'+esc(x.person_name||'Customer')+'</b><div class="sm muted">'+deskTime(x)+(x.offering_name?' · '+esc(x.offering_name):'')+'</div></div>'
     +'<div class="row" style="gap:8px;align-items:center"><b class="mono">'+money(x.cents||0)+'</b>'
     +'<button class="btn" data-desk="paid" data-slot="'+esc(x.id)+'" style="min-height:48px;padding:10px 16px">Mark received</button></div></div>';
  }).join('') : '<p class="sm muted">Everyone is settled up.</p>';
  h+='</div>';
  h+='<div class="card" style="display:grid;gap:8px"><div class="row" style="justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">'
    +'<div><h3 style="margin:0">Take appointments off</h3><div class="muted sm">Tick the dates to cancel, then remove them together. The time goes straight back on offer and the customer is told.</div></div>'
    +'<button class="btn" data-desk="all" style="min-height:48px;padding:10px 16px">Select all</button></div>';
  h+= out.length? out.map(function(x){
    return '<label class="row" style="gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:8px;min-height:48px">'
     +'<input type="checkbox" data-pick="'+esc(x.id)+'" style="width:24px;height:24px;min-width:24px">'
     +'<span><b>'+esc(x.person_name||'Customer')+'</b><div class="sm muted">'+deskTime(x)+'</div></span></label>';
  }).join('') : '<p class="sm muted">Nothing upcoming to remove.</p>';
  h+='<div class="row" style="gap:10px;flex-wrap:wrap"><button class="btn pri" data-desk="remove" style="min-height:48px;padding:12px 18px">Remove the ticked appointments</button>'
    +'<button class="btn" data-desk="none" style="min-height:48px;padding:12px 18px">Clear ticks</button></div></div>';
  el.innerHTML=h;
}).catch(function(e){ el.innerHTML='<p class="sm" style="color:var(--bad)">The desk could not be opened: '+esc(e.message||'no answer from the server')+'</p>' });
}
function deskPaid(slot,btn){
if(!slot) return;
btn.disabled=true; btn.textContent='Saving…';
deskFetch('/api/v1/ledger/'+encodeURIComponent(slot)+'/received','POST',{method:'cash'})
  .then(function(){ deskLoad(); })
  .catch(function(e){ btn.disabled=false; btn.textContent='Mark received'; alert('That did not save: '+e.message) });
}
function deskRemove(){
var picks=[].slice.call(document.querySelectorAll('[data-pick]')).filter(function(c){return c.checked}).map(function(c){return c.getAttribute('data-pick')});
if(!picks.length){ alert('Tick the appointments to remove first.'); return; }
if(!confirm('Remove '+picks.length+' appointment'+(picks.length===1?'':'s')+'? The time goes back on offer and the customer is told which dates were cancelled.')) return;
deskFetch('/api/v1/appointments/remove','POST',{slot_ids:picks}).then(function(r){
  var n=(r.removed||[]).length;
  alert('Removed '+n+' appointment'+(n===1?'':'s')+'. '
    +((r.notices&&r.notices.length)?('The customer has been told which dates went and which are still theirs'+(r.not_notified?(', and '+r.not_notified+' had no account on file.'):'.')):'No account was on file to notify.'));
  deskLoad();
}).catch(function(e){ alert('That did not save: '+e.message) });
}
document.addEventListener('click',function(e){
var b=e.target&&e.target.closest?e.target.closest('[data-desk]'):null; if(!b) return;
e.preventDefault();
var k=b.getAttribute('data-desk');
if(k==='load') deskLoad();
else if(k==='paid') deskPaid(b.getAttribute('data-slot'),b);
else if(k==='remove') deskRemove();
else if(k==='all') [].slice.call(document.querySelectorAll('[data-pick]')).forEach(function(c){c.checked=true});
else if(k==='none') [].slice.call(document.querySelectorAll('[data-pick]')).forEach(function(c){c.checked=false});
});
})();

</script>
